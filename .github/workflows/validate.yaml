name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare deterministic candidate
        run: npm run prepare-release
      - name: Ensure prepare only touches generated runtime
        shell: bash
        run: |
          set -euo pipefail
          UNEXPECTED=$(git diff --name-only | grep -Ev '^(src/navimower-map-card\.js|dist/navimower-map-card\.js)$' || true)
          test -z "$UNEXPECTED" || { echo "$UNEXPECTED"; exit 1; }
      - name: Snapshot prepared tree
        run: git status --porcelain=v1 > /tmp/status-before-tests
      - name: Run read-only regression suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/navimower-test-output.txt
      - name: Report test failure for beta9 investigation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '### Temporary beta9 CI failure trace'
            echo '```'
            tail -n 110 /tmp/navimower-test-output.txt || true
            echo '```'
          } > /tmp/navimower-failure-comment.txt
          gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" -f body="$(cat /tmp/navimower-failure-comment.txt)"

      - name: Ensure tests are read-only
        run: |
          git status --porcelain=v1 > /tmp/status-after-tests
          diff -u /tmp/status-before-tests /tmp/status-after-tests

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
