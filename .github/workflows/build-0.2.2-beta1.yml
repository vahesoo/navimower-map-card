name: Build 0.2.2-beta1 update

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/0.2.2-beta1-card-controls
    paths:
      - .github/workflows/build-0.2.2-beta1.yml

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' || github.head_ref == 'feature/0.2.2-beta1-card-controls'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/0.2.2-beta1-card-controls

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply beta1 changes
        run: |
          python scripts/prepare-beta1.py
          sed -i 's/0\.2\.1/0.2.2-beta1/g' tests/smoke.mjs

      - name: Build and test
        run: npm test

      - name: Commit generated card update
        shell: bash
        run: |
          git rm scripts/prepare-beta1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Navimower Map Card 0.2.2-beta1"
          git push origin HEAD:feature/0.2.2-beta1-card-controls
