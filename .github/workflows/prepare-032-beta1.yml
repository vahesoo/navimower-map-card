name: Prepare 0.3.2-beta1

on:
  push:
    branches:
      - release/0.3.2-beta1
    paths:
      - .github/workflows/prepare-032-beta1.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.2-beta1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build beta source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const SOURCE = 'src/navimower-map-card.js';
          let source = fs.readFileSync(SOURCE, 'utf8');
          const publicMarker = '// src/navimower-map-card.js\nvar NAVIMOWER_MAP_CARD_VERSION2 = "0.3.1-beta6";';
          if (!source.includes(publicMarker)) throw new Error('0.3.1-beta6 public marker not found');

          function iconSpec(name) {
            const svg = fs.readFileSync(`.github/tmp-032-icons/${name}.svg`, 'utf8');
            const view = svg.match(/viewBox="0 0 ([0-9.]+) ([0-9.]+)"/);
            const image = svg.match(/<image\b[^>]*\/>/s);
            if (!view || !image) throw new Error(`Invalid temporary SVG: ${name}`);
            return { width: Number(view[1]), height: Number(view[2]), markup: image[0] };
          }

          const artwork = {
            i_light: iconSpec('i_light'),
            i_dark: iconSpec('i_dark'),
            i2_lidar: iconSpec('i2_lidar'),
            x3: iconSpec('x3'),
            x4: iconSpec('x4'),
          };
          const artworkEntries = Object.entries(artwork).map(([key, spec]) =>
            `  ${key}: { width: ${spec.width}, height: ${spec.height}, markup: ${JSON.stringify(spec.markup)} }`
          ).join(',\n');

          const patch = `// 0.3.2-beta1: configurable history depth and model-aware mower artwork.\n` +
          `var MOWER_ICON_KEYS_032 = new Set(["auto", "h2", "i_light", "i_dark", "i2_lidar", "x3", "x4"]);\n` +
          `var MOWER_ICON_SPECS_032 = Object.freeze({\n` +
          `  h2: { width: 120, height: 159, markup: H2_MOWER_SVG },\n${artworkEntries}\n});\n` + String.raw`
function historyDays032(value) {
  const parsed = Math.round(Number(value));
  return Math.max(1, Math.min(31, Number.isFinite(parsed) ? parsed : 3));
}
function mowerIconConfig032(value) {
  const key = String(value || "auto").trim().toLowerCase();
  return MOWER_ICON_KEYS_032.has(key) ? key : "auto";
}
function sessionsForHistoryDay032(sessions, dayOffset) {
  const start = localDayStart(Number(dayOffset) || 0);
  const end = new Date(start);
  end.setDate(end.getDate() + 1);
  return (Array.isArray(sessions) ? sessions : []).filter((session) => {
    const sessionStart = asDate(session?.started_at || session?.start || session?.start_time);
    return sessionStart && sessionStart >= start && sessionStart < end;
  });
}
function mowerModel032(card) {
  const entityId = card?._resolved?.mower_entity || card?._resolved?.status_entity || card?._config?.entity || card?._config?.mower_entity;
  const state = entityId ? card?._hass?.states?.[entityId] : null;
  return String(
    card?._mowerModel032 ||
    state?.attributes?.model ||
    state?.attributes?.device_model ||
    ""
  ).trim();
}
function autoMowerIcon032(model) {
  const raw = String(model || "").trim().toUpperCase();
  const compact = raw.replace(/[\s_-]+/g, "");
  if (/^X4/.test(compact) || /\bX4\b/.test(raw)) return "x4";
  if (/^X3/.test(compact) || /\bX3\b/.test(raw)) return "x3";
  if ((/^I2/.test(compact) || /\bI2\b/.test(raw)) && /LIDAR|LIDAR/.test(compact)) return "i2_lidar";
  if (/^I/.test(compact) || /\bI[12]\b/.test(raw) || /AWD/.test(raw)) return "i_light";
  if (/^H/.test(compact) || /\bH[12]\b/.test(raw)) return "h2";
  return "h2";
}
function mowerIconKey032(card) {
  const configured = mowerIconConfig032(card?._config?.mower_icon);
  return configured === "auto" ? autoMowerIcon032(mowerModel032(card)) : configured;
}
function ensureMowerArtwork032(card) {
  const group = card?._mowerGroup;
  if (!group) return null;
  const key = mowerIconKey032(card);
  if (card._mowerArtworkKey032 !== key) {
    group.innerHTML = MOWER_ICON_SPECS_032[key].markup;
    group.dataset.mowerIcon = key;
    group.setAttribute("class", `nm-h2-mower nm-mower-${key.replaceAll("_", "-")}`);
    card._mowerArtworkKey032 = key;
    card._mowerRenderKey = null;
  }
  return MOWER_ICON_SPECS_032[key];
}
function mowerTransform032(card, cx, cy, heading) {
  const key = mowerIconKey032(card);
  const spec = MOWER_ICON_SPECS_032[key] || MOWER_ICON_SPECS_032.h2;
  const degrees = Number.isFinite(heading) ? 90 - heading : 90;
  const zoom = Math.max(1, finiteNumber(card?._view?.scale, 1));
  const normalizedScale = 58.83 / spec.height;
  const scale = normalizedScale * clamp(finiteNumber(card?._config?.mower_scale, 1), 0.5, 2.5) / zoom;
  return `translate(${Number(cx).toFixed(1)},${Number(cy).toFixed(1)}) rotate(${degrees.toFixed(1)}) scale(${scale.toFixed(4)}) translate(${(-spec.width / 2).toFixed(2)},${(-spec.height / 2).toFixed(2)})`;
}
function patchCard032Beta1() {
  const Card = NavimowerMapCard;
  const proto = Card?.prototype;
  if (!proto || proto._v032Beta1) return;
  proto._v032Beta1 = true;

  LABELS.history_days = "History days";
  LABELS.mower_icon = "Mower icon";

  const originalStub = Card.getStubConfig;
  Card.getStubConfig = function beta032Stub(...args) {
    const config = { ...(originalStub?.apply(this, args) || {}) };
    delete config.session_count;
    config.history_days = 3;
    config.mower_icon = "auto";
    return config;
  };

  const originalForm = Card.getConfigForm;
  Card.getConfigForm = function beta032ConfigForm(...args) {
    const form = originalForm.apply(this, args);
    const historyField = { name: "history_days", selector: { number: { min: 1, max: 31, step: 1, mode: "box" } } };
    const iconField = {
      name: "mower_icon",
      selector: { select: { options: [
        { value: "auto", label: "Automatic (mower model)" },
        { value: "h2", label: "H1 / H2" },
        { value: "i_light", label: "i-series light" },
        { value: "i_dark", label: "i-series dark" },
        { value: "i2_lidar", label: "i2 LiDAR" },
        { value: "x3", label: "X3 series" },
        { value: "x4", label: "X4 series" }
      ] } }
    };
    const walk = (node) => {
      if (Array.isArray(node)) {
        for (let i = node.length - 1; i >= 0; i -= 1) {
          if (node[i]?.name === "session_count") node.splice(i, 1);
        }
        const historyIndex = node.findIndex((item) => item?.name === "show_session_legend");
        if (historyIndex >= 0 && !node.some((item) => item?.name === "history_days")) {
          node.splice(historyIndex + 1, 0, historyField);
        }
        const mowerIndex = node.findIndex((item) => item?.name === "mower_scale");
        if (mowerIndex >= 0 && !node.some((item) => item?.name === "mower_icon")) {
          node.splice(mowerIndex, 0, iconField);
        }
        for (const item of node) walk(item);
      } else if (node && typeof node === "object") {
        for (const value of Object.values(node)) walk(value);
      }
    };
    walk(form);
    return form;
  };

  const originalSetConfig = proto.setConfig;
  proto.setConfig = function beta032SetConfig(config) {
    const incoming = {
      ...(config || {}),
      history_days: historyDays032(config?.history_days),
      mower_icon: mowerIconConfig032(config?.mower_icon)
    };
    const result = originalSetConfig.call(this, incoming);
    if (this._historyDayOffset !== null && Number(this._historyDayOffset) >= this._config.history_days) {
      this._historyDayOffset = null;
      this._historyBarRenderKey = null;
    }
    this._mowerArtworkKey032 = null;
    ensureMowerArtwork032(this);
    return result;
  };

  const originalEnsureDom = proto._ensureDom;
  proto._ensureDom = function beta032EnsureDom(...args) {
    const result = originalEnsureDom.apply(this, args);
    ensureMowerArtwork032(this);
    return result;
  };

  proto._sessionsForCurrentView = function beta032SessionsForCurrentView() {
    const sessions = this._sessionRecords({ applyLimit: false });
    const offset = this._historyDayOffset === null ? 0 : Number(this._historyDayOffset) || 0;
    return sessionsForHistoryDay032(sessions, offset);
  };

  proto._renderHistoryBar = function beta032RenderHistoryBar() {
    if (!this._historyBarEl) return;
    const selected = this._historyDayOffset;
    const visible = this._historyMenuOpen || selected !== null;
    const count = historyDays032(this._config?.history_days);
    const offsets = Array.from({ length: count }, (_item, index) => index);
    const historyBarKey = `${visible}|${selected ?? "today"}|${count}`;
    if (historyBarKey === this._historyBarRenderKey) return;
    this._historyBarRenderKey = historyBarKey;
    this._historyBarEl.style.display = visible ? "flex" : "none";
    if (!visible) {
      this._historyBarEl.innerHTML = "";
      return;
    }
    this._historyBarEl.innerHTML = offsets.map((offset) => {
      const value = offset === 0 ? "today" : String(offset);
      const label = offset === 0 ? "Today" : this._historyDateLabel(offset);
      const active = offset === 0 ? selected === null : Number(selected) === offset;
      return `<button type="button" class="nm-history-choice${active ? " active" : ""}" data-history-offset="${value}">${escapeHtml2(label)}</button>`;
    }).join("");
  };

  const originalRegistryResolve = proto._resolveEntitiesFromRegistry;
  if (typeof originalRegistryResolve === "function") {
    proto._resolveEntitiesFromRegistry = async function beta032RegistryResolve(...args) {
      const result = await originalRegistryResolve.apply(this, args);
      if (this._deviceId && this._hass?.callWS) {
        try {
          const devices = await this._hass.callWS({ type: "config/device_registry/list" });
          const device = Array.isArray(devices) ? devices.find((entry) => entry?.id === this._deviceId) : null;
          this._mowerModel032 = String(device?.model || device?.model_id || "").trim();
        } catch (_error) {
          this._mowerModel032 = this._mowerModel032 || "";
        }
      }
      this._mowerArtworkKey032 = null;
      ensureMowerArtwork032(this);
      this._mowerRenderKey = null;
      this._renderMower?.();
      return result;
    };
  }

  proto._renderMower = function beta032RenderMower() {
    if (!this._mowerGroup || !this._layout) return;
    const x = this._number(this._resolved.x_entity);
    const y = this._number(this._resolved.y_entity);
    const heading = this._number(this._resolved.heading_entity);
    const iconKey = mowerIconKey032(this);
    const renderKey = `${x}|${y}|${heading}|${iconKey}|${this._config.mower_scale}|${this._layout.scale}|${this._view.scale}`;
    if (renderKey === this._mowerRenderKey) return;
    this._mowerRenderKey = renderKey;
    if (x === null || y === null) {
      this._mowerGroup.style.display = "none";
      return;
    }
    ensureMowerArtwork032(this);
    const cx = this._layout.sx(x);
    const cy = this._layout.sy(y);
    this._mowerGroup.setAttribute("transform", mowerTransform032(this, cx, cy, heading));
    this._mowerGroup.style.display = "";
    if (typeof applyZoneMarkerScale === "function") applyZoneMarkerScale(this);
  };

  proto._mower = function beta032MowerMarkup(cx, cy, headingDegrees) {
    const key = mowerIconKey032(this);
    const spec = MOWER_ICON_SPECS_032[key] || MOWER_ICON_SPECS_032.h2;
    return `<g class="nm-h2-mower nm-mower-${key.replaceAll("_", "-")}" transform="${mowerTransform032(this, cx, cy, headingDegrees)}" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.38))">${spec.markup}</g>`;
  };

  console.info("[Navimower Map Card] 0.3.2-beta1 configurable history and mower artwork enabled");
}
if (globalThis.customElements) patchCard032Beta1();

`;

          source = source.replace(publicMarker, patch + '// src/navimower-map-card.js\nvar NAVIMOWER_MAP_CARD_VERSION2 = "0.3.2-beta1";');
          fs.writeFileSync(SOURCE, source);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '0.3.2-beta1';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = '0.3.2-beta1';
          if (lock.packages?.['']) lock.packages[''].version = '0.3.2-beta1';
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');

          let tests = fs.readFileSync('tests/single-runtime.mjs', 'utf8');
          tests = tests.replace(
            '["0.3.1-beta6", "0.3.1"].includes(pkg.version)',
            '["0.3.2-beta1", "0.3.2"].includes(pkg.version)'
          ).replace(
            '`expected 0.3.1-beta6 or stable 0.3.1, got ${pkg.version}`',
            '`expected 0.3.2-beta1 or stable 0.3.2, got ${pkg.version}`'
          ).replace('assert.match(source, /0\\.3\\.1-beta6/);', 'assert.match(source, /0\\.3\\.2-beta1/);');
          tests = tests.replace(
            '  "navimower.resume",\n',
            '  "navimower.resume",\n  "history_days",\n  "mower_icon",\n  "i2_lidar",\n  "nm-mower-x4",\n'
          );
          tests = tests.replace(
            'console.log("0.3.1 single-runtime regression checks passed");',
            'assert.doesNotMatch(source, /session_count:\\s*"Maximum sessions shown"/);\nconsole.log("0.3.2-beta1 single-runtime regression checks passed");'
          );
          fs.writeFileSync('tests/single-runtime.mjs', tests);

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = readme.replace(
            '- Day-based map history for Today and the two preceding dates',
            '- Configurable day-based map history, defaulting to Today and the two preceding dates'
          ).replace(
            '- Three-day History selector with matching routes and session times for each day',
            '- Configurable History selector with matching routes and session times for each day'
          ).replace(
            '- Configurable fixed-size mower icon that stays readable while the map is zoomed',
            '- Model-aware mower artwork with automatic H/i/X-series selection, manual override, and configurable fixed size'
          ).replace('## Today and three-day history', '## Today and configurable history')
          .replace(
            'The **History** button in the card header offers three day choices:\n\n- Today\n- the previous date in compact `DD.MM` format\n- the date two days ago in compact `DD.MM` format\n\nFor example, on 31 August the choices are **Today**, **30.08**, and **29.08**. Selecting an earlier date filters both the map routes and session buttons to that calendar day. This intentionally keeps the interface simple; multiple sessions on the same day are displayed together and remain individually selectable from the session row.',
            'The **History** button in the card header offers a configurable number of calendar days. `history_days` accepts `1` through `31` and defaults to `3`, so the default choices are **Today** plus the two preceding dates in compact `DD.MM` format. Days remain selectable even when no mowing session was recorded on that date. Selecting a date filters both map routes and session buttons to that calendar day, and all sessions from the selected day are shown.\n\n```yaml\nhistory_days: 3\nshow_session_legend: true\n```\n\n`show_session_legend` controls only the session-time row. The legacy `session_count` YAML key is accepted for compatibility but no longer limits History.'
          );
          const appearanceNeedle = 'show_session_legend: true\nsession_count: 6\n';
          if (readme.includes(appearanceNeedle)) {
            readme = readme.replace(appearanceNeedle, 'show_session_legend: true\nhistory_days: 3\n');
          }
          const dockNeedle = 'dock_color: "#37474f"\n';
          if (readme.includes(dockNeedle) && !readme.includes('mower_icon: auto')) {
            readme = readme.replace(dockNeedle, 'dock_color: "#37474f"\nmower_icon: auto\nmower_scale: 1\n');
          }
          readme = readme.replace(
            'The static card template and embedded mower artwork are parsed once per loaded frontend module.',
            'The static card template and embedded mower artwork are kept inside the single HACS runtime; the selected mower artwork is swapped in place without external asset requests.'
          );
          fs.writeFileSync('README.md', readme);

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const section = `## 0.3.2-beta1\n\n### Added\n\n- Model-aware mower artwork with automatic H1/H2, i-series, i2 LiDAR, X3, and X4 selection.\n- Manual \`mower_icon\` override in YAML and the visual editor, including light/dark i-series variants.\n- Configurable \`history_days\` (1-31), defaulting to 3 calendar days.\n\n### Changed\n\n- History day choices no longer depend on whether sessions exist for that date.\n- All sessions for the selected History day are shown; the legacy \`session_count\` value no longer limits History and is removed from the visual editor.\n- \`show_session_legend\` now only controls the session-time row.\n- New mower artwork is embedded in the existing single runtime asset; no extra HACS runtime files are added.\n\n`;
          changelog = changelog.replace('# Changelog\n', '# Changelog\n\n' + section);
          fs.writeFileSync('CHANGELOG.md', changelog);

          fs.mkdirSync('.github/release-notes', { recursive: true });
          fs.writeFileSync('.github/release-notes/0.3.2-beta1.md', `title: Navimower Map Card 0.3.2-beta1\n\n### Added\n- Automatic mower artwork selection from the Home Assistant mower model, with H1/H2, i-series, i2 LiDAR, X3, and X4 artwork.\n- Manual **Mower icon** override in the visual editor and YAML.\n- **History days** setting from 1 to 31, defaulting to 3 days.\n\n### Changed\n- History always offers the configured calendar-day range, including days without mowing sessions.\n- The selected day shows all of its sessions; the old **Maximum sessions shown** control no longer limits History.\n- **Show session times** only controls the session-time row.\n- All mower artwork remains embedded in the existing single HACS runtime file; this prerelease adds no extra runtime assets.\n`);
          NODE

          rm -rf .github/tmp-032-icons
          rm -f .github/workflows/prepare-032-beta1.yml

      - name: Validate
        run: npm test

      - name: Commit prepared beta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare 0.3.2-beta1"
          git push origin HEAD:release/0.3.2-beta1
