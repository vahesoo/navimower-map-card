name: Publish card release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and test
        run: npm test

      - name: Read stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) echo "Version $VERSION is a prerelease; skipping stable publication"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release files
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -f ".github/release-notes/${VERSION}.md"
          test "$(node -p "require('./hacs.json').filename")" = "navimower-map-card.js"
          test -f src/navimower-map-card.js
          test -f dist/navimower-map-card.js
          cmp -s src/navimower-map-card.js dist/navimower-map-card.js
          grep -q "${VERSION}" src/navimower-map-card.js
          node scripts/check-runtime-layout.mjs
          git diff --exit-code

      - name: Tag and publish latest release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES=".github/release-notes/${VERSION}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              if gh release view "${TAG}" >/dev/null 2>&1; then
                echo "Refusing to move ${TAG} while a published release still exists"
                exit 1
              fi
              git push origin ":refs/tags/${TAG}"
              git tag -d "${TAG}"
            fi
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "Navimower Map Card ${VERSION}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --latest --title "Navimower Map Card ${VERSION}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" --latest --target "${GITHUB_SHA}" --title "Navimower Map Card ${VERSION}" --notes-file "${NOTES}"
          fi
