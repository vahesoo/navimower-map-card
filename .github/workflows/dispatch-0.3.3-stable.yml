name: Dispatch 0.3.3 stable preparation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-0.3.3-stable.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare stable release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          if pkg.get('version') != '0.3.3-beta1':
              raise SystemExit(f"unexpected package version: {pkg.get('version')}")
          pkg['version'] = '0.3.3'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          source_path = Path('src/navimower-map-card.js')
          source = source_path.read_text()
          old = 'var NAVIMOWER_MAP_CARD_VERSION2 = "0.3.3-beta1";'
          new = 'var NAVIMOWER_MAP_CARD_VERSION2 = "0.3.3";'
          if old not in source:
              raise SystemExit('runtime beta version marker not found')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/single-runtime.mjs')
          test = test_path.read_text()
          test = test.replace('pkg.version === "0.3.3-beta1"', 'pkg.version === "0.3.3"', 1)
          test = test.replace('`expected 0.3.3-beta1, got ${pkg.version}`', '`expected stable 0.3.3, got ${pkg.version}`', 1)
          test = test.replace('/var NAVIMOWER_MAP_CARD_VERSION2 = "0\\.3\\.3-beta1";/', '/var NAVIMOWER_MAP_CARD_VERSION2 = "0\\.3\\.3";/', 1)
          test = test.replace('console.log("0.3.3-beta1 single-runtime regression checks passed");', 'console.log("0.3.3 stable single-runtime regression checks passed");', 1)
          test_path.write_text(test)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          marker = '# Changelog\n\n'
          section = '''## 0.3.3 - 2026-08-19\n\n### Fixed\n\n- Promote the field-tested `i_dark` mower artwork correction from 0.3.3-beta1 to stable.\n- Rebuilt the manual i-series dark artwork directly from the supplied original 60 px source asset and preserved its transparent embedded PNG instead of the earlier WebP conversion.\n\n### Packaging\n\n- Keep the stable release on the single `navimower-map-card.js` HACS runtime with source/distribution byte parity and no extra SVG/PNG runtime assets.\n\n'''
          if '## 0.3.3 - 2026-08-19' not in changelog:
              if not changelog.startswith(marker):
                  raise SystemExit('unexpected changelog header')
              changelog = marker + section + changelog[len(marker):]
              changelog_path.write_text(changelog)

          notes = '''# Navimower Map Card 0.3.3\n\nNavimower Map Card 0.3.3 promotes the field-tested 0.3.3-beta1 mower-artwork fix to the latest stable release.\n\n## Fixed\n\n- Correct the manual `mower_icon: i_dark` artwork so it renders properly.\n- Rebuild the dark i-series artwork directly from the supplied original 60 px source asset (`16076.svg`, 85x120).\n- Preserve the source asset's transparent embedded PNG instead of the earlier WebP conversion.\n- Keep mower size normalization, heading rotation, automatic model detection and all other mower artwork unchanged.\n\n## Packaging\n\n- Continue shipping one HACS runtime file: `navimower-map-card.js`.\n- Keep `src/navimower-map-card.js` and `dist/navimower-map-card.js` byte-for-byte identical after the build.\n- No separate SVG, PNG, loader or temporary helper assets are added to the release tree.\n\nThis stable release contains the same runtime behavior that was verified in 0.3.3-beta1, with only the prerelease version markers promoted to 0.3.3.\n'''
          Path('.github/release-notes/0.3.3.md').write_text(notes)
          PY
          npm test
          git diff --check
          test "$(node -p "require('./package.json').version")" = "0.3.3"
          cmp -s src/navimower-map-card.js dist/navimower-map-card.js
          test "$(find src -maxdepth 1 -type f -name '*.js' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.js' | wc -l)" -eq 1
      - name: Commit prepared stable branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/navimower-map-card.js dist/navimower-map-card.js tests/single-runtime.mjs CHANGELOG.md .github/release-notes/0.3.3.md
          git diff --cached --quiet && exit 0
          git commit -m "Prepare Navimower Map Card 0.3.3"
          git push origin HEAD:release/0.3.3
