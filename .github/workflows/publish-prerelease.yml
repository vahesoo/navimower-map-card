name: Publish card prerelease

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test card
        run: npm test
      - name: Commit generated beta runtime
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-beta*) ;;
            *) exit 0 ;;
          esac
          if git diff --quiet -- src/navimower-map-card.js dist/navimower-map-card.js CHANGELOG.md README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/navimower-map-card.js dist/navimower-map-card.js CHANGELOG.md README.md
          git commit -m "Build Navimower Map Card $VERSION"
          git push origin HEAD:main
      - name: Publish beta tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-beta*) ;;
            *) echo "Version $VERSION is not a beta; skipping prerelease"; exit 0 ;;
          esac
          TAG="v$VERSION"
          NOTES=".github/release-notes/$VERSION.md"
          TARGET_SHA=$(git rev-parse HEAD)
          test -f "$NOTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$TARGET_SHA"
          else
            git tag -a "$TAG" "$TARGET_SHA" -m "Navimower Map Card $VERSION"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "Navimower Map Card $VERSION" --notes-file "$NOTES"
          else
            gh release create "$TAG" --prerelease --target "$TARGET_SHA" --title "Navimower Map Card $VERSION" --notes-file "$NOTES"
          fi
