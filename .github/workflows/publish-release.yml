name: Publish card release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - src/navimower-map-card.js
      - .github/release-notes/**
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and test
        run: npm test

      - name: Read stable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) echo "Version $VERSION is a prerelease; skipping stable publication"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release files
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -f ".github/release-notes/${VERSION}.md"
          grep -q "NAVIMOWER_MAP_CARD_VERSION = \"${VERSION}\"" src/navimower-map-card.js
          grep -q "NAVIMOWER_MAP_CARD_VERSION = \"${VERSION}\"" dist/navimower-map-card.js
          git diff --exit-code

      - name: Tag and publish latest release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES=".github/release-notes/${VERSION}.md"
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}"
          else
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "Navimower Map Card ${VERSION}"
            git push origin "${TAG}"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --latest --title "Navimower Map Card ${VERSION}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" --latest --target "${GITHUB_SHA}" --title "Navimower Map Card ${VERSION}" --notes-file "${NOTES}"
          fi
