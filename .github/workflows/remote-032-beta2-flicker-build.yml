name: Remote 0.3.2-beta2 flicker fix build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER MAP CARD 0.3.2-BETA2 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.3.2-beta2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and validate beta2
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/map-beta2-build.log) 2>&1
          set -euo pipefail
          git fetch origin "${BUILD_BRANCH}"
          git checkout -B "${BUILD_BRANCH}" "origin/${BUILD_BRANCH}"

          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path.cwd()
          SOURCE = ROOT / "src" / "navimower-map-card.js"

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          package_path = ROOT / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          if package.get("version") != "0.3.2-beta1":
              raise SystemExit(f"Expected 0.3.2-beta1 base, got {package.get('version')!r}")
          package["version"] = "0.3.2-beta2"
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          replace_once(
              SOURCE,
              '''  if (/^H/.test(compact) || /\\bH[12]\\b/.test(raw)) return "h2";\n  return "h2";\n}\nfunction mowerIconKey032(card) {\n  const configured = mowerIconConfig032(card?._config?.mower_icon);\n  return configured === "auto" ? autoMowerIcon032(mowerModel032(card)) : configured;\n}\n''',
              '''  if (/^H/.test(compact) || /\\bH[12]\\b/.test(raw)) return "h2";\n  return null;\n}\nfunction mowerIconKey032(card) {\n  const configured = mowerIconConfig032(card?._config?.mower_icon);\n  if (configured !== "auto") return configured;\n  const detected = autoMowerIcon032(mowerModel032(card));\n  if (detected) return detected;\n  return card?._mowerModelResolved032 ? "h2" : null;\n}\n''',
              "deferred automatic mower selection",
          )

          replace_once(
              SOURCE,
              '''function ensureMowerArtwork032(card) {\n  const group = card?._mowerGroup;\n  if (!group) return null;\n  const key = mowerIconKey032(card);\n  if (card._mowerArtworkKey032 !== key) {\n''',
              '''function ensureMowerArtwork032(card) {\n  const group = card?._mowerGroup;\n  if (!group) return null;\n  const key = mowerIconKey032(card);\n  if (!key) {\n    group.style.display = "none";\n    return null;\n  }\n  if (card._mowerArtworkKey032 !== key) {\n''',
              "hide unresolved automatic mower artwork",
          )

          replace_once(
              SOURCE,
              '''    proto._resolveEntitiesFromRegistry = async function beta032RegistryResolve(...args) {\n      const result = await originalRegistryResolve.apply(this, args);\n      if (this._deviceId && this._hass?.callWS) {\n''',
              '''    proto._resolveEntitiesFromRegistry = async function beta032RegistryResolve(...args) {\n      this._mowerModelResolved032 = false;\n      if (mowerIconConfig032(this?._config?.mower_icon) === "auto" && !autoMowerIcon032(mowerModel032(this))) {\n        if (this._mowerGroup) this._mowerGroup.style.display = "none";\n      }\n      const result = await originalRegistryResolve.apply(this, args);\n      if (this._deviceId && this._hass?.callWS) {\n''',
              "mark registry model resolution pending",
          )

          replace_once(
              SOURCE,
              '''      }\n      this._mowerArtworkKey032 = null;\n      ensureMowerArtwork032(this);\n''',
              '''      }\n      this._mowerModelResolved032 = true;\n      this._mowerArtworkKey032 = null;\n      ensureMowerArtwork032(this);\n''',
              "mark registry model resolution complete",
          )

          replace_once(
              SOURCE,
              '''    ensureMowerArtwork032(this);\n    const cx = this._layout.sx(x);\n''',
              '''    const artwork = ensureMowerArtwork032(this);\n    if (!artwork) {\n      this._mowerGroup.style.display = "none";\n      return;\n    }\n    const cx = this._layout.sx(x);\n''',
              "do not reveal unresolved live mower",
          )

          replace_once(
              SOURCE,
              '''  proto._mower = function beta032MowerMarkup(cx, cy, headingDegrees) {\n    const key = mowerIconKey032(this);\n    const spec = MOWER_ICON_SPECS_032[key] || MOWER_ICON_SPECS_032.h2;\n''',
              '''  proto._mower = function beta032MowerMarkup(cx, cy, headingDegrees) {\n    const key = mowerIconKey032(this);\n    if (!key) return "";\n    const spec = MOWER_ICON_SPECS_032[key] || MOWER_ICON_SPECS_032.h2;\n''',
              "do not reveal unresolved static mower",
          )

          replace_once(
              SOURCE,
              'console.info("[Navimower Map Card] 0.3.2-beta1 configurable history and mower artwork enabled");',
              'console.info("[Navimower Map Card] 0.3.2-beta2 flicker-safe mower artwork enabled");',
              "beta2 console identity",
          )
          replace_once(
              SOURCE,
              'var NAVIMOWER_MAP_CARD_VERSION2 = "0.3.2-beta1";',
              'var NAVIMOWER_MAP_CARD_VERSION2 = "0.3.2-beta2";',
              "beta2 runtime identity",
          )

          tests = ROOT / "tests" / "single-runtime.mjs"
          replace_once(
              tests,
              '''  ["0.3.2-beta1", "0.3.2"].includes(pkg.version),\n  `expected 0.3.2-beta1 or stable 0.3.2, got ${pkg.version}`,\n''',
              '''  ["0.3.2-beta2", "0.3.2"].includes(pkg.version),\n  `expected 0.3.2-beta2 or stable 0.3.2, got ${pkg.version}`,\n''',
              "beta2 package identity test",
          )
          replace_once(
              tests,
              'assert.match(source, /0\\.3\\.2-beta1/);',
              'assert.match(source, /0\\.3\\.2-beta2/);',
              "beta2 runtime identity test",
          )
          replace_once(
              tests,
              'console.log("0.3.2-beta1 single-runtime regression checks passed");',
              '''const autoStart = source.indexOf("function autoMowerIcon032(model)");\nconst autoEnd = source.indexOf("function mowerTransform032", autoStart);\nconst autoBlock = source.slice(autoStart, autoEnd);\nassert.match(autoBlock, /return null;/);\nassert.match(autoBlock, /_mowerModelResolved032 \\? "h2" : null/);\nassert.match(autoBlock, /group\\.style\\.display = "none"/);\nassert.match(source, /this\\._mowerModelResolved032 = false/);\nassert.match(source, /this\\._mowerModelResolved032 = true/);\nassert.match(source, /const artwork = ensureMowerArtwork032\\(this\\)/);\nassert.match(source, /if \\(!key\\) return ""/);\n\nconsole.log("0.3.2-beta2 single-runtime regression checks passed");''',
              "flicker regression assertions",
          )

          changelog_path = ROOT / "CHANGELOG.md"
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "# Changelog\n\n"
          if not changelog.startswith(marker):
              raise SystemExit("Unexpected changelog header")
          section = '''## 0.3.2-beta2\n\n### Fixed\n\n- Remove the brief wrong mower-artwork flash on dashboard/page reload when **Mower icon** is set to `auto`.\n- Keep automatic mower artwork hidden while the Home Assistant device model is still being resolved instead of temporarily rendering the H1/H2 fallback.\n- Show the detected X3/X4/i-series/H-series artwork immediately when the model is already available from entity attributes.\n- Fall back to H1/H2 only after model resolution has completed and no supported model could be identified.\n- Manual `mower_icon` selections remain immediate and are not delayed by model detection.\n\n\n'''
          changelog_path.write_text(marker + section + changelog[len(marker):], encoding="utf-8")

          notes = ROOT / ".github" / "release-notes" / "0.3.2-beta2.md"
          notes.write_text('''title: Navimower Map Card 0.3.2-beta2\n\nRemove automatic mower artwork flicker during card startup.\n\n### Fixed\n- With **Mower icon: Automatic**, the card no longer briefly shows the H1/H2 artwork before an X3, X4 or i-series model is resolved.\n- The mower stays hidden for the short unresolved interval, then appears once with the correct detected artwork.\n- If Home Assistant already exposes a recognizable mower model in entity attributes, the correct artwork is shown immediately without waiting for the device-registry lookup.\n- H1/H2 remains the fallback only after model resolution finishes without a recognized supported model.\n- Manual mower-icon overrides still render immediately.\n\n### Unchanged\n- Mower position, heading, scale, history rendering and model artwork assets are unchanged.\n- The card still ships as one `navimower-map-card.js` HACS runtime file.\n''', encoding="utf-8")
          PY

          npm test
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          expected = {
              ".github/release-notes/0.3.2-beta2.md",
              "CHANGELOG.md",
              "dist/navimower-map-card.js",
              "package.json",
              "src/navimower-map-card.js",
              "tests/single-runtime.mjs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()) | set(
              subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines()
          )
          if changed != expected:
              raise SystemExit(f"Unexpected beta2 diff scope: {sorted(changed)}")

          package = json.loads(Path("package.json").read_text())
          assert package["version"] == "0.3.2-beta2"
          source = Path("src/navimower-map-card.js").read_text()
          dist = Path("dist/navimower-map-card.js").read_text()
          assert source == dist
          assert 'var NAVIMOWER_MAP_CARD_VERSION2 = "0.3.2-beta2";' in source
          assert 'return card?._mowerModelResolved032 ? "h2" : null;' in source
          assert 'this._mowerModelResolved032 = false;' in source
          assert 'this._mowerModelResolved032 = true;' in source
          assert 'if (!key) return "";' in source
          assert 'const artwork = ensureMowerArtwork032(this);' in source
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes/0.3.2-beta2.md \
                  CHANGELOG.md \
                  dist/navimower-map-card.js \
                  package.json \
                  src/navimower-map-card.js \
                  tests/single-runtime.mjs
          git diff --cached --check
          git commit -m "Prepare Navimower Map Card 0.3.2-beta2 flicker fix"
          git push origin HEAD:"${BUILD_BRANCH}"

      - name: Report success
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          gh issue comment "${{ github.event.issue.number }}" --body "0.3.2-beta2 remote build succeeded. Full npm test, runtime-layout checks, syntax/smoke regressions, source/dist parity and exact diff-scope validation passed; branch \`${BUILD_BRANCH}\` was pushed at \`${sha}\`."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Report failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          tail -n 180 /tmp/map-beta2-build.log > /tmp/map-beta2-tail.log || true
          {
            echo '0.3.2-beta2 remote build failed before publishing the completed release branch.'
            echo
            echo '```text'
            cat /tmp/map-beta2-tail.log
            echo '```'
          } > /tmp/map-beta2-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/map-beta2-comment.md
          exit 1
