name: Prepare beta2 runtime

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - scripts/build.mjs
      - tests/custom-areas.mjs
      - tests/single-runtime.mjs
      - .github/release-notes/0.3.4-beta2.md
      - .github/workflows/prepare-beta2.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/0.3.4-beta2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.4-beta2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Commit generated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/navimower-map-card.js dist/navimower-map-card.js CHANGELOG.md README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Navimower Map Card 0.3.4-beta2"
          git push origin HEAD:release/0.3.4-beta2
