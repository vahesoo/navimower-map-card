name: Patch beta6 cleanup docs once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/beta6-doc-patch-once.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update README and changelog
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const readmePath = "README.md";
          let readme = readFileSync(readmePath, "utf8");
          const oldAssetBlock = `For 0.3.1 prereleases, each beta uses a unique cache-safe JavaScript filename. **0.3.1-beta3** is distributed as:\n\n\`\`\`text\ndist/navimower-map-card-0.3.1-b3.js\n\`\`\`\n\nBeta1 remains \`navimower-map-card-0.3.1-b1.js\`, beta2 remains \`navimower-map-card-0.3.1-b2.js\`, later betas use matching \`-bN.js\` names, and stable 0.3.1 will use \`navimower-map-card-0.3.1.js\`. This prevents a browser or Android WebView from silently reusing the previous beta module URL.\n`;
          const newAssetBlock = `Current prereleases and stable releases use one HACS runtime asset:\n\n\`\`\`text\ndist/navimower-map-card.js\n\`\`\`\n\nThe runtime filename intentionally stays stable. Beta history is retained by Git commits, tags and GitHub releases rather than by keeping version-specific JavaScript loaders on \`main\`.\n`;
          if (!readme.includes(oldAssetBlock)) throw new Error("README cache-safe beta asset block was not found");
          readme = readme.replace(oldAssetBlock, newAssetBlock);
          writeFileSync(readmePath, readme);

          const changelogPath = "CHANGELOG.md";
          let changelog = readFileSync(changelogPath, "utf8");
          if (!changelog.includes("## 0.3.1-beta6 - 2026-08-11")) {
            const section = `## 0.3.1-beta6 - 2026-08-11\n\n- Flattened the accumulated core + patch-layer chain into one cumulative \`src/navimower-map-card.js\` runtime while preserving the complete beta5 behavior.\n- Reduced \`src/\` and \`dist/\` to exactly one JavaScript file each; \`dist/navimower-map-card.js\` is an exact build copy of the source.\n- Changed HACS back to the stable \`navimower-map-card.js\` filename instead of creating a new cache-busting loader filename for every beta.\n- Reworked the build so it deletes/recreates \`dist/\` and refuses a second source runtime JavaScript file.\n- Added a permanent layout guard that rejects extra runtime files, version-specific local loader imports, or source/distribution drift.\n- Documented the single-runtime rule and the explicit process required if a future architecture genuinely needs multiple runtime files.\n- Made beta/stable publishing version-bump driven: implementation, tests and documentation land first; the final \`package.json\` version change triggers publication.\n- Kept the beta line cumulative: the final tested beta remains the stable-release candidate without a later step that merges previous beta runtime files.\n\n`;
            changelog = changelog.replace("# Changelog\n\n", `# Changelog\n\n${section}`);
          }
          writeFileSync(changelogPath, changelog);
          NODE
          git diff --check
      - name: Commit documentation migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git commit -m "Document beta6 single-runtime cleanup"
          git push origin HEAD:main
