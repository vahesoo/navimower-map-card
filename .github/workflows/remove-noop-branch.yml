name: Remove temporary connector branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-noop-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary branch and this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete __noop__ || true
          git rm .github/workflows/remove-noop-branch.yml
          git commit -m "Remove temporary branch cleanup workflow"
          git push origin HEAD:main
