name: Release 0.2.2-beta1 now

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'release/0.2.2-beta1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test card
        run: npm test
      - name: Publish beta tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "0.2.2-beta1"
          TAG="v$VERSION"
          NOTES=".github/release-notes/$VERSION.md"
          test -f "$NOTES"
          TARGET_SHA=$(git rev-parse HEAD)
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$TARGET_SHA"
          else
            git tag -a "$TAG" "$TARGET_SHA" -m "Navimower Map Card $VERSION"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "Navimower Map Card $VERSION" --notes-file "$NOTES"
          else
            gh release create "$TAG" --prerelease --title "Navimower Map Card $VERSION" --notes-file "$NOTES"
          fi
