name: Prepare 0.3.2-beta1 branch once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/prepare-032-beta1-pr.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.2-beta1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build clean release branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/prepare-032-beta1.yml').read_text()
          start_marker = "          node <<'NODE'\n"
          end_marker = "\n          NODE\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          replacements = {
              'group.setAttribute("class", `nm-h2-mower nm-mower-${key.replaceAll("_", "-")}`);': 'group.setAttribute("class", "nm-h2-mower nm-mower-" + key.replaceAll("_", "-"));',
              'return `translate(${Number(cx).toFixed(1)},${Number(cy).toFixed(1)}) rotate(${degrees.toFixed(1)}) scale(${scale.toFixed(4)}) translate(${(-spec.width / 2).toFixed(2)},${(-spec.height / 2).toFixed(2)})`;': 'return "translate(" + Number(cx).toFixed(1) + "," + Number(cy).toFixed(1) + ") rotate(" + degrees.toFixed(1) + ") scale(" + scale.toFixed(4) + ") translate(" + (-spec.width / 2).toFixed(2) + "," + (-spec.height / 2).toFixed(2) + ")";',
              'const historyBarKey = `${visible}|${selected ?? "today"}|${count}`;': 'const historyBarKey = [visible, selected ?? "today", count].join("|");',
              'return `<button type="button" class="nm-history-choice${active ? " active" : ""}" data-history-offset="${value}">${escapeHtml2(label)}</button>`;': 'return "<button type=\\"button\\" class=\\"nm-history-choice" + (active ? " active" : "") + "\\" data-history-offset=\\"" + value + "\\">" + escapeHtml2(label) + "</button>";',
              'const renderKey = `${x}|${y}|${heading}|${iconKey}|${this._config.mower_scale}|${this._layout.scale}|${this._view.scale}`;': 'const renderKey = [x, y, heading, iconKey, this._config.mower_scale, this._layout.scale, this._view.scale].join("|");',
              'return `<g class="nm-h2-mower nm-mower-${key.replaceAll("_", "-")}" transform="${mowerTransform032(this, cx, cy, headingDegrees)}" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.38))">${spec.markup}</g>`;': 'return "<g class=\\"nm-h2-mower nm-mower-" + key.replaceAll("_", "-") + "\\" transform=\\"" + mowerTransform032(this, cx, cy, headingDegrees) + "\\" style=\\"filter:drop-shadow(0 1px 2px rgba(0,0,0,.38))\\">" + spec.markup + "</g>";',
          }
          for old, new in replacements.items():
              if old not in code:
                  raise SystemExit(f'missing builder template marker: {old[:80]}')
              code = code.replace(old, new)
          lock_block = """const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
lock.version = '0.3.2-beta1';
if (lock.packages?.['']) lock.packages[''].version = '0.3.2-beta1';
fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\\n');

"""
          if lock_block not in code:
              raise SystemExit('package-lock builder block not found')
          code = code.replace(lock_block, '')
          Path('/tmp/prepare-032-beta1.cjs').write_text(code)
          PY
          node /tmp/prepare-032-beta1.cjs
          node <<'NODE'
          const fs = require('fs');
          const sourcePath = 'src/navimower-map-card.js';
          let source = fs.readFileSync(sourcePath, 'utf8');
          source = source.replace('  session_count: "Maximum sessions shown",', '  session_count: "Maximum sessions shown",\n  history_days: "History days",\n  mower_icon: "Mower icon",');
          source = source.replace('  LABELS.history_days = "History days";\n  LABELS.mower_icon = "Mower icon";\n', '');
          source = source.replace('/LIDAR|LIDAR/.test(compact)', '/LIDAR/.test(compact)');
          fs.writeFileSync(sourcePath, source);
          const testPath = 'tests/single-runtime.mjs';
          let tests = fs.readFileSync(testPath, 'utf8');
          tests = tests.replace(/assert\.doesNotMatch\(source, \/session_count:[^\n]+\n/, '');
          fs.writeFileSync(testPath, tests);
          NODE
          rm -rf .github/tmp-032-icons
          rm -f .github/workflows/prepare-032-beta1.yml
      - name: Validate prepared beta
        run: npm test
      - name: Commit prepared beta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare 0.3.2-beta1"
          git push origin HEAD:release/0.3.2-beta1
