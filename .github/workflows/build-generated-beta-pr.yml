name: Build generated beta PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-generated-beta:
    if: startsWith(github.head_ref, 'release/0.3.4-beta')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate beta runtime and run tests
        run: npm test
      - name: Commit generated files to PR branch
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if git diff --quiet -- src/navimower-map-card.js dist/navimower-map-card.js CHANGELOG.md README.md; then
            echo 'Generated files already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/navimower-map-card.js dist/navimower-map-card.js CHANGELOG.md README.md
          git commit -m "Build Navimower Map Card $VERSION"
          git push origin HEAD:${{ github.head_ref }}
